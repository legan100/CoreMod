plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }

    // Client-Mod (Hauptmenü) als eigene Jar: der Server-Code landet nie beim Spieler und umgekehrt
    client
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    addModdingDependenciesTo(sourceSets.client)

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }

        coremod_client {
            sourceSet(sourceSets.client)
        }
    }

    // Wie in echt: der Client hat nur die Client-Mod, der Server nur CoreMod
    runs {
        client {
            client()
            loadedMods = [mods.coremod_client]
        }

        server {
            server()
            loadedMods = [mods."${mod_id}"]

            programArgument '--nogui'

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            loadedMods = [mods."${mod_id}"]

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            loadedMods = [mods."${mod_id}"]

            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            )
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
        }
    }
}

dependencies {
    // ========================================================
    // Lombok
    // ========================================================

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'


    // ========================================================
    // Database
    // ========================================================

    implementation('com.zaxxer:HikariCP:6.3.3') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }

    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.6'


    // ========================================================
    // Configuration / Security
    // ========================================================

    implementation 'org.yaml:snakeyaml:2.1'
    implementation 'org.mindrot:jbcrypt:0.4'


    // ========================================================
    // Framework
    // ========================================================

    implementation files('libs/framework-1.1-SNAPSHOT.jar')


    // ========================================================
    // Tests
    // ========================================================

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}


var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description       : mod_description
]

var generateModMetadata = tasks.register(
        "generateModMetadata",
        ProcessResources
) {
    inputs.properties replaceProperties

    from "src/main/templates"
    into "build/generated/sources/modMetadata"

    expand replaceProperties
}

var generateClientModMetadata = tasks.register(
        "generateClientModMetadata",
        ProcessResources
) {
    inputs.properties replaceProperties

    from "src/client/templates"
    into "build/generated/sources/clientModMetadata"

    expand replaceProperties
}

sourceSets.main.resources.srcDir generateModMetadata
sourceSets.client.resources.srcDir generateClientModMetadata

neoForge.ideSyncTask generateModMetadata
neoForge.ideSyncTask generateClientModMetadata

// build/libs/coremod-<version>.jar → Server, build/libs/coremod-<version>-client.jar → Spieler
var clientJar = tasks.register("clientJar", Jar) {
    from sourceSets.client.output
    archiveClassifier = "client"
}

tasks.named("assemble") {
    dependsOn clientJar
}


// ========================================================
// Publishing
// ========================================================

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}


// ========================================================
// IntelliJ IDEA
// ========================================================

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
